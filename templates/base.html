<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyPulse{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark">&#9889;</span> StudyPulse</a>
      <nav class="nav-links">
        {% if user %}
          <span class="nav-user">{{ user.name }}</span>
          <a class="btn ghost small" href="#" data-logout>Log out</a>
        {% else %}
          {% block nav_links %}
            <a class="btn ghost small" href="/login">Log in</a>
            <a class="btn small" href="/register">Sign up free</a>
          {% endblock %}
        {% endif %}
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  <script src="/static/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
